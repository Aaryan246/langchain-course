[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aaryan Rastogi", email = "aaryan24602@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.3",
    "langchain-ollama>=1.1.0",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.1.3",
    "langchain-unstructured>=1.0.1",
    "python-dotenv>=1.2.4",
    "python-magic-bin>=0.4.14",
    "unstructured>=0.27.28",
]

[project.scripts]
langchain-course = "langchain_course:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
